server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encaminha /api/* para o backend de produção, removendo o prefixo /api
  # (o mesmo que o proxy.conf.cjs faz no ambiente local).
  location /api/ {
    proxy_pass https://site--gerencimanto-adocoes--cj6ybc4ywxr4.code.run/;
    proxy_set_header Host site--gerencimanto-adocoes--cj6ybc4ywxr4.code.run;
    proxy_ssl_server_name on;

    # Sem o Origin o Spring trata a chamada como mesma origem e não aplica CORS
    proxy_set_header Origin "";

    # Upload de mídias dos acompanhamentos
    client_max_body_size 50m;
    proxy_read_timeout 120s;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca em cache, para o navegador sempre pegar a versão nova
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rotas do Angular: qualquer caminho desconhecido cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
