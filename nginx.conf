server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Arquivos com hash no nome podem ficar em cache por muito tempo
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca em cache, para o navegador sempre pegar a versão nova
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rotas do Angular: qualquer caminho desconhecido cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
